<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none" class="trust-badge-svg">
  <defs>
    <linearGradient id="goldStarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5B041"/>
      <stop offset="100%" stop-color="#C77F12"/>
    </linearGradient>
  </defs>

  <!-- Circular Base -->
  <circle cx="80" cy="80" r="76" fill="#FAFAF7" stroke="#1E4D2B" stroke-width="4"/>
  <circle cx="80" cy="80" r="70" fill="none" stroke="#E89818" stroke-width="1.5" stroke-dasharray="3 2"/>

  <!-- Top Title -->
  <text x="80" y="36" font-family="'Montserrat', sans-serif" font-size="10.5" font-weight="800" fill="#14361E" text-anchor="middle" letter-spacing="1">
    TOP RATED SERVICE
  </text>

  <!-- 5 Gold Stars Cluster -->
  <g transform="translate(18, 48)">
    <!-- Star 1 -->
    <polygon points="12,2 15,9 22,10 17,15 18,22 12,18 6,22 7,15 2,10 9,9" fill="url(#goldStarGrad)"/>
    <!-- Star 2 -->
    <polygon points="38,2 41,9 48,10 43,15 44,22 38,18 32,22 33,15 28,10 35,9" fill="url(#goldStarGrad)"/>
    <!-- Star 3 (Center Largest) -->
    <g transform="translate(62, -4) scale(1.15)">
      <polygon points="12,2 15,9 22,10 17,15 18,22 12,18 6,22 7,15 2,10 9,9" fill="url(#goldStarGrad)"/>
    </g>
    <!-- Star 4 -->
    <polygon points="88,2 91,9 98,10 93,15 94,22 88,18 82,22 83,15 78,10 85,9" fill="url(#goldStarGrad)"/>
    <!-- Star 5 -->
    <polygon points="114,2 117,9 124,10 119,15 120,22 114,18 108,22 109,15 104,10 111,9" fill="url(#goldStarGrad)"/>
  </g>

  <!-- Rating Value -->
  <text x="80" y="100" font-family="'Montserrat', sans-serif" font-size="20" font-weight="900" fill="#E89818" text-anchor="middle">
    5.0 STARS
  </text>

  <!-- Bottom Ribbon -->
  <rect x="20" y="116" width="120" height="26" rx="6" fill="#1E4D2B" stroke="#E89818" stroke-width="1.5"/>
  <text x="80" y="133" font-family="'Montserrat', sans-serif" font-size="9.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">
    ANDOVER &amp; WICHITA
  </text>
</svg>
