<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none" class="service-graphic-svg">
  <defs>
    <linearGradient id="bgStump" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EFEBE9"/>
      <stop offset="100%" stop-color="#FAFAF7"/>
    </linearGradient>
    <linearGradient id="grinderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E89818"/>
      <stop offset="100%" stop-color="#C77F12"/>
    </linearGradient>
  </defs>

  <rect width="600" height="400" rx="16" fill="url(#bgStump)"/>

  <!-- Underground & Soil Layer -->
  <rect x="0" y="260" width="600" height="140" fill="#5D4037"/>
  <rect x="0" y="240" width="600" height="20" fill="#1E4D2B"/>

  <!-- Tree Stump Cut Below Grade -->
  <g transform="translate(140, 170)">
    <!-- Main Stump Body -->
    <path d="M40 90 L60 40 L160 40 L180 90 Z" fill="#8D6E63" stroke="#3E2723" stroke-width="3"/>
    <!-- Top Cut Rings -->
    <ellipse cx="110" cy="40" rx="50" ry="16" fill="#D7CCC8" stroke="#3E2723" stroke-width="2"/>
    <ellipse cx="110" cy="40" rx="25" ry="8" fill="#BCAAA4" stroke="#8D6E63" stroke-width="1.5"/>
    
    <!-- Underground Roots Grinded Out -->
    <path d="M30 90 Q10 110 -20 120 M190 90 Q210 110 240 120" stroke="#A1887F" stroke-width="4" stroke-dasharray="4 4"/>
  </g>

  <!-- Heavy Duty Stump Grinding Machine -->
  <g transform="translate(290, 80)">
    <!-- Machine Chassis -->
    <rect x="50" y="40" width="120" height="70" rx="8" fill="#14361E" stroke="#1E4D2B" stroke-width="2"/>
    <circle cx="80" cy="120" r="22" fill="#2C3E35" stroke="#1A2421" stroke-width="6"/>
    <circle cx="140" cy="120" r="22" fill="#2C3E35" stroke="#1A2421" stroke-width="6"/>
    
    <!-- Grinder Arm & Cutting Wheel -->
    <line x1="60" y1="90" x2="-20" y2="150" stroke="url(#grinderGrad)" stroke-width="12" stroke-linecap="round"/>
    <circle cx="-20" cy="150" r="30" fill="url(#grinderGrad)" stroke="#14361E" stroke-width="3"/>
    <!-- Teeth on Wheel -->
    <circle cx="-20" cy="150" r="34" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-dasharray="6 8"/>

    <!-- Wood Chips & Flying Debris -->
    <circle cx="-40" cy="140" r="4" fill="#D7CCC8"/>
    <circle cx="-50" cy="160" r="5" fill="#D7CCC8"/>
    <circle cx="-30" cy="170" r="3" fill="#D7CCC8"/>
    <circle cx="-10" cy="180" r="4" fill="#D7CCC8"/>
  </g>

  <!-- Badge Overlay -->
  <g transform="translate(30, 30)">
    <rect width="180" height="38" rx="8" fill="#14361E" stroke="#E89818" stroke-width="2"/>
    <text x="90" y="24" font-family="'Montserrat', sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle">
      BELOW-GRADE LEVELING
    </text>
  </g>
</svg>
