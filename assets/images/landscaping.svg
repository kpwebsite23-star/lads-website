<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none" class="service-graphic-svg">
  <defs>
    <linearGradient id="bgLandscaping" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8F5E9"/>
      <stop offset="100%" stop-color="#FAFAF7"/>
    </linearGradient>
    <linearGradient id="mulchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4E342E"/>
      <stop offset="100%" stop-color="#3E2723"/>
    </linearGradient>
  </defs>

  <rect width="600" height="400" rx="16" fill="url(#bgLandscaping)"/>

  <!-- Manicured Luxury Flowerbed & Shrub Design -->
  <g transform="translate(60, 100)">
    <!-- Natural Stone Retaining Border -->
    <path d="M0 220 Q240 180 480 220 L480 260 L0 260 Z" fill="url(#mulchGrad)"/>
    <ellipse cx="60" cy="220" rx="30" ry="12" fill="#B0BEC5" stroke="#78909C" stroke-width="2"/>
    <ellipse cx="120" cy="216" rx="32" ry="12" fill="#90A4AE" stroke="#607D8B" stroke-width="2"/>
    <ellipse cx="180" cy="214" rx="30" ry="12" fill="#B0BEC5" stroke="#78909C" stroke-width="2"/>
    <ellipse cx="240" cy="212" rx="32" ry="12" fill="#90A4AE" stroke="#607D8B" stroke-width="2"/>
    <ellipse cx="300" cy="214" rx="30" ry="12" fill="#B0BEC5" stroke="#78909C" stroke-width="2"/>
    <ellipse cx="360" cy="216" rx="32" ry="12" fill="#90A4AE" stroke="#607D8B" stroke-width="2"/>
    <ellipse cx="420" cy="220" rx="30" ry="12" fill="#B0BEC5" stroke="#78909C" stroke-width="2"/>

    <!-- Ornamental Japanese Maple / Shrub -->
    <g transform="translate(80, 40)">
      <path d="M40 160 Q30 110 50 70" stroke="#5D4037" stroke-width="6" fill="none"/>
      <ellipse cx="50" cy="50" rx="40" ry="30" fill="#C62828"/>
      <ellipse cx="70" cy="65" rx="35" ry="25" fill="#B71C1C"/>
      <ellipse cx="30" cy="65" rx="35" ry="25" fill="#E53935"/>
    </g>

    <!-- Sculpted Boxwood Spheres -->
    <g transform="translate(240, 90)">
      <circle cx="40" cy="80" r="35" fill="#2D723E"/>
      <circle cx="40" cy="75" r="28" fill="#52B788"/>
    </g>
    <g transform="translate(340, 110)">
      <circle cx="35" cy="70" r="30" fill="#1E4D2B"/>
      <circle cx="35" cy="65" r="22" fill="#2D723E"/>
    </g>

    <!-- Colorful Perennials / Flowers -->
    <circle cx="160" cy="180" r="10" fill="#F5B041"/>
    <circle cx="190" cy="185" r="8" fill="#9C27B0"/>
    <circle cx="210" cy="180" r="9" fill="#E91E63"/>
    <circle cx="300" cy="185" r="8" fill="#F5B041"/>
  </g>

  <!-- Crisp Edged Green Lawn -->
  <rect x="0" y="340" width="600" height="60" fill="#1E4D2B"/>
  <line x1="0" y1="340" x2="600" y2="340" stroke="#2D723E" stroke-width="4"/>

  <!-- Badge Overlay -->
  <g transform="translate(30, 30)">
    <rect width="180" height="38" rx="8" fill="#1E4D2B" stroke="#E89818" stroke-width="2"/>
    <text x="90" y="24" font-family="'Montserrat', sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle">
      PROPERTY ELEVATION
    </text>
  </g>
</svg>
