<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none" class="brand-logo-svg">
  <defs>
    <linearGradient id="treeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D723E"/>
      <stop offset="100%" stop-color="#14361E"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5B041"/>
      <stop offset="100%" stop-color="#C77F12"/>
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Logo Mark Graphic -->
  <g transform="translate(10, 8)" filter="url(#subtleShadow)">
    <!-- Outer Shield / Circle Base -->
    <circle cx="32" cy="32" r="30" fill="url(#treeGrad)" stroke="#E89818" stroke-width="2.5"/>
    
    <!-- Stylized Tree Canopy & Foliage Rings -->
    <path d="M32 10 C22 10 16 16 16 24 C12 25 10 29 10 33 C10 38 14 42 19 42 C21 42 23 41 24 40 L24 50 L40 50 L40 40 C41 41 43 42 45 42 C50 42 54 38 54 33 C54 29 52 25 48 24 C48 16 42 10 32 10 Z" fill="#FAFAF7" opacity="0.95"/>
    
    <!-- Tree Trunk -->
    <path d="M29 36 L35 36 L36 50 L28 50 Z" fill="#C77F12"/>
    <path d="M26 50 L38 50 L40 54 L24 54 Z" fill="#14361E"/>

    <!-- LC Letters Interlocked -->
    <text x="32" y="32" font-family="'Montserrat', 'Arial Black', sans-serif" font-size="15" font-weight="900" fill="#1E4D2B" text-anchor="middle" letter-spacing="1">LC</text>
    
    <!-- Gold Leaf Accent -->
    <path d="M32 12 C34 16 38 18 38 20 C34 20 32 16 32 12 Z" fill="url(#goldGrad)"/>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(85, 26)">
    <!-- Primary Title -->
    <text x="0" y="0" font-family="'Montserrat', system-ui, -apple-system, sans-serif" font-size="20" font-weight="900" fill="#14361E" letter-spacing="0.5">
      LC TREE
    </text>
    <text x="96" y="0" font-family="'Montserrat', system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#E89818" letter-spacing="0.5">
      &amp; LANDSCAPING
    </text>
    
    <!-- LLC Tag & Location Subtext -->
    <text x="0" y="18" font-family="'Inter', system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#2D723E" letter-spacing="1.5">
      LLC • EAST WICHITA &amp; ANDOVER, KS
    </text>
    
    <text x="0" y="31" font-family="'Inter', system-ui, sans-serif" font-size="9" font-weight="600" fill="#667085" letter-spacing="0.8">
      FULLY INSURED • OWNER: LAD OBORNY
    </text>
  </g>
</svg>
