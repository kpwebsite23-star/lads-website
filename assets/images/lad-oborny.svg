<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none" class="owner-portrait-svg">
  <defs>
    <linearGradient id="bgLad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAFAF7"/>
      <stop offset="100%" stop-color="#E8F5E9"/>
    </linearGradient>
    <linearGradient id="vestGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFA726"/>
      <stop offset="100%" stop-color="#E89818"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFCC80"/>
      <stop offset="100%" stop-color="#F5B041"/>
    </linearGradient>
  </defs>

  <!-- Background Card Circle -->
  <circle cx="300" cy="300" r="280" fill="url(#bgLad)" stroke="#1E4D2B" stroke-width="8"/>
  <circle cx="300" cy="300" r="268" fill="none" stroke="#E89818" stroke-width="2" stroke-dasharray="6 3"/>

  <!-- Arborist Truck & Tree Background Elements -->
  <g transform="translate(100, 120)" opacity="0.35">
    <ellipse cx="80" cy="100" rx="90" ry="70" fill="#2D723E"/>
    <ellipse cx="320" cy="90" rx="100" ry="80" fill="#1E4D2B"/>
    <rect x="260" y="160" width="160" height="90" rx="10" fill="#14361E"/>
  </g>

  <!-- Lad Oborny Character Illustration -->
  <g transform="translate(150, 80)">
    <!-- Shoulders & Torso with Arborist Safety Vest -->
    <path d="M40 440 L80 270 L220 270 L260 440 Z" fill="#1E4D2B"/>
    
    <!-- Safety High-Vis Vest -->
    <path d="M70 280 L110 440 L190 440 L230 280 L190 280 L150 360 L110 280 Z" fill="url(#vestGrad)"/>
    <!-- Reflective Safety Stripes -->
    <line x1="85" y1="340" x2="215" y2="340" stroke="#FAFAF7" stroke-width="12" stroke-linecap="round"/>
    <line x1="95" y1="390" x2="205" y2="390" stroke="#FAFAF7" stroke-width="10" stroke-linecap="round"/>

    <!-- Company Badge on Vest -->
    <rect x="80" y="300" width="36" height="24" rx="4" fill="#14361E"/>
    <text x="98" y="316" font-family="'Montserrat', sans-serif" font-size="8" font-weight="900" fill="#E89818" text-anchor="middle">LC</text>

    <!-- Neck & Collar -->
    <rect x="130" y="220" width="40" height="60" rx="6" fill="#F5B041"/>

    <!-- Head & Friendly Face -->
    <ellipse cx="150" cy="180" rx="55" ry="65" fill="url(#skinGrad)"/>
    
    <!-- Friendly Eyes & Smile -->
    <ellipse cx="130" cy="175" rx="5" ry="4" fill="#14361E"/>
    <ellipse cx="170" cy="175" rx="5" ry="4" fill="#14361E"/>
    <path d="M125" y="165" />
    <path d="M122 165 Q130 160 138 165" stroke="#5D4037" stroke-width="3" fill="none"/>
    <path d="M162 165 Q170 160 178 165" stroke="#5D4037" stroke-width="3" fill="none"/>
    
    <!-- Friendly Warm Smile -->
    <path d="M130 205 Q150 225 170 205" stroke="#14361E" stroke-width="4" fill="#FFFFFF" stroke-linecap="round"/>
    
    <!-- Professional Arborist Hardhat / Cap -->
    <path d="M90 150 C90 95 210 95 210 150 Z" fill="#14361E"/>
    <!-- Hardhat brim -->
    <ellipse cx="150" cy="150" rx="70" ry="12" fill="#E89818"/>
    <!-- Logo on Hardhat -->
    <circle cx="150" cy="120" r="14" fill="#FAFAF7"/>
    <text x="150" y="125" font-family="'Montserrat', sans-serif" font-size="9" font-weight="900" fill="#1E4D2B" text-anchor="middle">LC</text>
  </g>

  <!-- Nameplate Ribbon at Bottom -->
  <g transform="translate(100, 480)">
    <rect width="400" height="70" rx="14" fill="#14361E" stroke="#E89818" stroke-width="3"/>
    <text x="200" y="34" font-family="'Montserrat', sans-serif" font-size="20" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">
      LAD OBORNY
    </text>
    <text x="200" y="55" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#E89818" text-anchor="middle" letter-spacing="1">
      OWNER &amp; HEAD ARBORIST
    </text>
  </g>
</svg>
