<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none" class="service-graphic-svg">
  <defs>
    <linearGradient id="bgRemoval" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8F5E9"/>
      <stop offset="100%" stop-color="#FAFAF7"/>
    </linearGradient>
    <linearGradient id="treeBark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3E2723"/>
      <stop offset="100%" stop-color="#5D4037"/>
    </linearGradient>
  </defs>

  <!-- Card Background -->
  <rect width="600" height="400" rx="16" fill="url(#bgRemoval)"/>

  <!-- Background Forest Silhouettes -->
  <ellipse cx="100" cy="300" rx="140" ry="120" fill="#C8E6C9" opacity="0.6"/>
  <ellipse cx="500" cy="280" rx="160" ry="130" fill="#C8E6C9" opacity="0.6"/>

  <!-- Precision Tree Removal Illustration -->
  <g transform="translate(180, 40)">
    <!-- Base tree trunk -->
    <path d="M70 320 L90 140 L150 140 L170 320 Z" fill="url(#treeBark)"/>
    
    <!-- Precision Felling Notch Cut -->
    <polygon points="90,200 130,220 90,240" fill="#E89818" stroke="#C77F12" stroke-width="2"/>
    <line x1="150" y1="225" x2="135" y2="225" stroke="#E89818" stroke-width="4"/>

    <!-- Dismantled Top Section Suspended Safely -->
    <g transform="translate(60, 20) rotate(-15)">
      <rect x="20" y="40" width="60" height="80" rx="8" fill="url(#treeBark)"/>
      <ellipse cx="50" cy="20" rx="70" ry="50" fill="#2D723E"/>
      <ellipse cx="50" cy="10" rx="50" ry="40" fill="#52B788"/>
      <!-- Rigging Harness Line -->
      <line x1="50" y1="-40" x2="50" y2="40" stroke="#E89818" stroke-width="4" stroke-dasharray="6 3"/>
    </g>

    <!-- Professional Rigging Pulley & Crane Hook -->
    <circle cx="110" cy="-20" r="16" fill="#14361E" stroke="#E89818" stroke-width="3"/>
    <path d="M110 -4 L110 20 L120 30" stroke="#E89818" stroke-width="4" fill="none"/>
  </g>

  <!-- Ground Line & Manicured Grass -->
  <rect x="0" y="350" width="600" height="50" fill="#1E4D2B"/>
  <line x1="0" y1="350" x2="600" y2="350" stroke="#2D723E" stroke-width="4"/>

  <!-- Badge Overlay -->
  <g transform="translate(30, 30)">
    <rect width="180" height="38" rx="8" fill="#14361E" stroke="#E89818" stroke-width="2"/>
    <text x="90" y="24" font-family="'Montserrat', sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle">
      HAZARDOUS &amp; CRANE
    </text>
  </g>
</svg>
