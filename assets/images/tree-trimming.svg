<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none" class="service-graphic-svg">
  <defs>
    <linearGradient id="bgTrimming" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8F5E9"/>
      <stop offset="100%" stop-color="#FAFAF7"/>
    </linearGradient>
    <linearGradient id="canopyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#52B788"/>
      <stop offset="50%" stop-color="#2D723E"/>
      <stop offset="100%" stop-color="#1E4D2B"/>
    </linearGradient>
  </defs>

  <rect width="600" height="400" rx="16" fill="url(#bgTrimming)"/>

  <!-- Beautiful Sculpted Tree Illustration -->
  <g transform="translate(180, 50)">
    <!-- Tree Trunk -->
    <path d="M100 310 C90 220 70 170 40 140 C80 150 110 180 120 220 C130 170 160 140 200 130 C170 170 150 210 140 310 Z" fill="#4E342E"/>
    
    <!-- Sculpted Canopy Clouds (Elevated & Thinned for Maximum Health & Sunlight) -->
    <ellipse cx="60" cy="110" rx="70" ry="55" fill="url(#canopyGrad)"/>
    <ellipse cx="180" cy="100" rx="75" ry="60" fill="url(#canopyGrad)"/>
    <ellipse cx="120" cy="60" rx="80" ry="60" fill="url(#canopyGrad)"/>

    <!-- Light rays filtering through trimmed canopy -->
    <polygon points="120,60 80,240 160,240" fill="#FFE082" opacity="0.35"/>

    <!-- Arborist Pole Saw / Pruning Shears Graphic -->
    <line x1="220" y1="260" x2="170" y2="90" stroke="#E89818" stroke-width="4" stroke-linecap="round"/>
    <circle cx="170" cy="90" r="8" fill="#14361E" stroke="#E89818" stroke-width="2"/>
    <line x1="165" y1="80" x2="175" y2="85" stroke="#FFFFFF" stroke-width="3"/>
  </g>

  <!-- Ground Line -->
  <rect x="0" y="350" width="600" height="50" fill="#1E4D2B"/>
  <line x1="0" y1="350" x2="600" y2="350" stroke="#2D723E" stroke-width="4"/>

  <!-- Badge Overlay -->
  <g transform="translate(30, 30)">
    <rect width="180" height="38" rx="8" fill="#1E4D2B" stroke="#E89818" stroke-width="2"/>
    <text x="90" y="24" font-family="'Montserrat', sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle">
      CANOPY SHAPING
    </text>
  </g>
</svg>
