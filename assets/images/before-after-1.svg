<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" fill="none" class="before-after-svg">
  <defs>
    <linearGradient id="stormSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#455A64"/>
      <stop offset="100%" stop-color="#78909C"/>
    </linearGradient>
  </defs>

  <!-- Sky Backdrop -->
  <rect width="600" height="450" fill="url(#stormSky)"/>

  <!-- Residential House Roof -->
  <g transform="translate(40, 180)">
    <polygon points="100,20 280,180 -40,180" fill="#37474F"/>
    <polygon points="340,60 480,180 200,180" fill="#263238"/>
    <rect x="0" y="180" width="500" height="120" fill="#ECEFF1"/>
    <!-- Gutters & Windows -->
    <rect x="-40" y="175" width="520" height="10" fill="#CFD8DC"/>
    <rect x="40" y="210" width="80" height="70" fill="#90A4AE"/>
    <rect x="220" y="210" width="80" height="70" fill="#90A4AE"/>
  </g>

  <!-- Massive Decaying / Hazardous Tree Leaning Over Roof -->
  <g transform="translate(360, 40)">
    <!-- Leaning Trunk -->
    <path d="M120 380 C80 280 20 200 -80 160 C-140 130 -160 80 -180 30 C-130 50 -90 90 -40 130 C10 170 80 260 160 380 Z" fill="#3E2723"/>
    
    <!-- Dead branches overhanging roof -->
    <path d="M-80 160 L-180 110 M-110 140 L-190 170 M-140 120 L-220 90" stroke="#4E342E" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Sparse dying canopy leaves -->
    <ellipse cx="-180" cy="80" rx="60" ry="35" fill="#8D6E63" opacity="0.8"/>
    <ellipse cx="-120" cy="110" rx="50" ry="30" fill="#A1887F" opacity="0.8"/>
    <ellipse cx="-20" cy="180" rx="70" ry="40" fill="#795548" opacity="0.7"/>

    <!-- Warning / Hazard Indicator -->
    <circle cx="-140" cy="140" r="22" fill="#E89818" stroke="#FFFFFF" stroke-width="2"/>
    <text x="-140" y="148" font-family="'Montserrat', sans-serif" font-size="20" font-weight="900" fill="#FFFFFF" text-anchor="middle">!</text>
  </g>

  <!-- Ground Line with Fallen Debris & Mess -->
  <rect x="0" y="380" width="600" height="70" fill="#546E7A"/>
  <!-- Broken twigs on yard -->
  <line x1="120" y1="410" x2="160" y2="418" stroke="#3E2723" stroke-width="3"/>
  <line x1="280" y1="400" x2="340" y2="408" stroke="#3E2723" stroke-width="4"/>
  <line x1="420" y1="415" x2="460" y2="405" stroke="#3E2723" stroke-width="3"/>

  <!-- "BEFORE" Badge Label -->
  <g transform="translate(30, 30)">
    <rect width="130" height="40" rx="8" fill="#D32F2F" stroke="#FFFFFF" stroke-width="2"/>
    <text x="65" y="26" font-family="'Montserrat', sans-serif" font-size="16" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
      BEFORE
    </text>
  </g>

  <!-- Subtitle Caption -->
  <g transform="translate(30, 80)">
    <rect width="250" height="28" rx="6" fill="rgba(0,0,0,0.6)"/>
    <text x="125" y="19" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">
      Hazardous Oak Threatening Andover Roof
    </text>
  </g>
</svg>
